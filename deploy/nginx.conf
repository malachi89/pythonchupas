server {
    listen 3000;
    server_name _;
    root /var/www/pythonchupas;
    index index.html;

    gzip on;
    gzip_types text/html application/javascript application/json;

    etag on;
    expires 1y;

    location / {
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "DENY";
    }

    location /health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
